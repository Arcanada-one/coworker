name: dependabot-auto-merge

# Merges routine Dependabot updates once the repository's own CI has actually
# concluded green.
#
# Design notes, both learned the hard way in SEC-0039:
#
#  1. It reacts to CI completion (workflow_run) instead of waiting for CI. An earlier
#     version blocked on `gh pr checks --watch`; this org has a single shared
#     ci-general runner, so the waiting job occupied the only runner while the
#     CI it waited for starved behind it. Reacting costs seconds, never blocks.
#
#  2. It gates on observed check conclusions, not on `gh pr merge --auto`.
#     Only two repositories in this org have required status checks on main
#     (private repos cannot have branch protection on the current plan), so
#     `--auto` would merge instantly with no CI gate almost everywhere.
#
# Scope is deliberately narrow: same-major dependency bumps whose diff touches
# no governance path. Majors, and anything editing .github/workflows, CODEOWNERS,
# branch-protection config or the credential/execution boundary, are left for a
# human decision — a dependency bot must not rewrite CI or ownership unremarked.

on:
  workflow_run:
    # Named explicitly per repository: workflow_run cannot glob, and check_suite
    # does NOT fire for Actions-created suites (anti-recursion rule) — verified
    # empirically in SEC-0039, the check_suite revision never triggered.
    workflows: ["ci", "public-surface"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: dependabot-auto-merge
    # Job-level `if` is evaluated BEFORE a runner is assigned, so a non-matching
    # event costs nothing. Without it the job claims a runner just to discover
    # the PR is not Dependabot's — and workflow_run fires once per upstream
    # workflow, so a repo with two CI workflows spawns two jobs per push by
    # anyone. In SEC-0039 that put 22 useless runs on the org's single
    # ci-general runner before it was caught.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    # GitHub-hosted: public repos get free unlimited hosted minutes, and the
    # org's single self-hosted ci-general runner is permanently contended —
    # targeting it left these jobs queued indefinitely (SEC-0039). Private-repo
    # callers need self-hosted, since the org's PAID hosted minutes are spent.
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          prs=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
                  --jq '[.[] | select(.state=="open") | .number] | .[]' || true)
          [ -n "$prs" ] || { echo "no open PR for ${HEAD_SHA}"; exit 0; }

          for pr in $prs; do
            echo "::group::PR #${pr}"
            meta=$(gh api "repos/${REPO}/pulls/${pr}")
            author=$(jq -r '.user.login' <<<"$meta")
            title=$(jq -r '.title'      <<<"$meta")
            base=$(jq -r '.base.ref'    <<<"$meta")
            draft=$(jq -r '.draft'      <<<"$meta")

            if [ "$author" != "dependabot[bot]" ]; then echo "skip: author=$author"; echo "::endgroup::"; continue; fi
            if [ "$draft" = "true" ]; then echo "skip: draft"; echo "::endgroup::"; continue; fi
            if [ "$base" != "${{ github.event.repository.default_branch }}" ]; then
              echo "skip: base=$base"; echo "::endgroup::"; continue
            fi

            # --- semver gate -------------------------------------------------
            # Fail closed: anything that does not parse as an unambiguous
            # same-major bump is left alone. Title parsing is used because
            # dependabot/fetch-metadata needs a pull_request context, which a
            # workflow_run event does not carry.
            if [[ "$title" =~ from\ ([0-9]+)\.([0-9]+)\.?([0-9]*)[^\ ]*\ to\ ([0-9]+)\.([0-9]+)\.?([0-9]*) ]]; then
              from_major="${BASH_REMATCH[1]}"; to_major="${BASH_REMATCH[4]}"
              from_minor="${BASH_REMATCH[2]}"
            else
              echo "skip: cannot parse versions from title"; echo "::endgroup::"; continue
            fi
            from_patch="${BASH_REMATCH[3]}"; to_patch="${BASH_REMATCH[6]}"
            to_minor="${BASH_REMATCH[5]}"
            if [ "$from_major" != "$to_major" ]; then
              echo "skip: major bump ${from_major} -> ${to_major}"; echo "::endgroup::"; continue
            fi
            # A version carrying no patch component is an X.Y line (CPython,
            # container base images, Go). There the MINOR is the compatibility
            # axis, not the major: python 3.12-slim -> 3.14-slim is a breaking
            # runtime change that major-equality alone would wave through.
            # This exact case was merged by hand in SEC-0039 before the gate
            # was corrected.
            if [ -z "$from_patch" ] || [ -z "$to_patch" ]; then
              if [ "$from_minor" != "$to_minor" ]; then
                echo "skip: X.Y line bump ${from_major}.${from_minor} -> ${to_major}.${to_minor} (minor is the compatibility axis)"
                echo "::endgroup::"; continue
              fi
            fi
            # 0.x releases treat the minor as the breaking axis.
            if [ "$from_major" = "0" ]; then
              if [ "$from_minor" != "$to_minor" ]; then
                echo "skip: 0.x minor bump is breaking by convention"; echo "::endgroup::"; continue
              fi
            fi

            # --- governance gate ---------------------------------------------
            files=$(gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" --jq '.[].filename')
            if grep -qE '^(\.github/workflows/|\.github/CODEOWNERS|\.github/settings\.yml|\.github/branch-protection|\.github/.*governance|\.github/.*\.pub|dev-tools/.*governance)' <<<"$files" \
               || grep -qE '(credential-broker/|execution-boundary/|supervisor/src/spawn\.rs|tools/src/bash\.rs)' <<<"$files"; then
              echo "skip: touches a governance path — needs a human decision"
              echo "::endgroup::"; continue
            fi

            # --- CI gate ------------------------------------------------------
            runs=$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                    --jq "[.check_runs[] | select(.name != \"${{ github.workflow }}\") | {n:.name,s:.status,c:.conclusion}]")
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[]|select(.s!="completed")]|length' <<<"$runs")
            bad=$(jq '[.[]|select(.c!="success" and .c!="neutral" and .c!="skipped")]|length' <<<"$runs")

            if [ "$total" -eq 0 ]; then echo "skip: no CI ran — absence of checks is not a pass"; echo "::endgroup::"; continue; fi
            if [ "$pending" -gt 0 ]; then echo "skip: $pending check(s) still running"; echo "::endgroup::"; continue; fi
            if [ "$bad" -gt 0 ]; then
              echo "skip: CI not green"; jq -r '.[]|select(.c!="success" and .c!="neutral" and .c!="skipped")|"   \(.c) \(.n)"' <<<"$runs"
              echo "::endgroup::"; continue
            fi

            # --- merge, then read the result back -----------------------------
            echo "merging #${pr}: ${title}"
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch || true
            sleep 5
            if [ "$(gh api "repos/${REPO}/pulls/${pr}" --jq '.merged')" = "true" ]; then
              echo "merged #${pr}"
            else
              echo "::warning::merge of #${pr} did not land"
            fi
            echo "::endgroup::"
          done
