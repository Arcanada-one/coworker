name: dependabot-auto-merge

# Auto-merges routine Dependabot updates (semver-patch / semver-minor /
# pinned-action SHA bumps) once the repository's OWN CI has actually passed.
#
# Why this waits for real check conclusions instead of using `gh pr merge --auto`:
# 49 of 51 Arcanada-one repositories have ZERO required status checks on main.
# `--auto` merges as soon as branch protection is satisfied, so on those repos
# it would merge instantly with no CI gate at all. This workflow therefore
# gates on observed check conclusions, which is a real gate everywhere.
#
# Majors, and anything whose CI is red or absent, are deliberately left open.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: [self-hosted, linux, arcana-ai, docker, ci-general]
    steps:
      # NOTE: PR code is never checked out or executed. pull_request_target runs
      # with a writable token, so checking out the head would be a code-injection
      # sink. Everything below uses only the GitHub API via gh.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide eligibility
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "::notice::update-type=$UPDATE_TYPE is not auto-mergeable; leaving for review." ;;
          esac

      - name: Wait for this repository's CI to conclude
        id: ci
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SELF: ${{ github.workflow }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            # Exclude (a) this workflow, and (b) Dependabot's own dynamic update
            # jobs, which attach to the branch and are not repository CI.
            runs=$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate \
              --jq "[.check_runs[] | select(.name != \"$SELF\") | {n:.name,s:.status,c:.conclusion}]")
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[]|select(.s!="completed")]|length' <<<"$runs")
            bad=$(jq '[.[]|select(.c=="failure" or .c=="timed_out" or .c=="cancelled")]|length' <<<"$runs")

            if [ "$bad" -gt 0 ]; then
              echo "::warning::CI failed; not merging."
              jq -r '.[]|select(.c=="failure" or .c=="timed_out" or .c=="cancelled")|"  FAILED \(.n)"' <<<"$runs"
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # A repo with no CI at all must NOT be treated as passing.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::No conclusive CI within 30m (total=$total pending=$pending); not merging."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 30
          done

      - name: Merge
        if: steps.gate.outputs.eligible == 'true' && steps.ci.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          before=$(gh api "repos/$REPO/commits/${{ github.event.pull_request.base.ref }}" --jq .sha)
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          sleep 5
          after=$(gh api "repos/$REPO/commits/${{ github.event.pull_request.base.ref }}" --jq .sha)
          merged=$(gh api "repos/$REPO/pulls/$PR" --jq .merged)
          # Read the result back rather than trusting the merge call's exit code.
          if [ "$merged" != "true" ]; then
            echo "::error::merge did not land (base $before -> $after)"; exit 1
          fi
          echo "merged PR #$PR; base $before -> $after"
