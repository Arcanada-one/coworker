name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    # Datarim fork deny: refuse untrusted fork PR code on org self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci-general]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Isolate from residual site-packages on shared self-hosted runners
      # (measured 2026-11-18: lint-test 3.12 reused ruff 0.12.11 and failed UP038).
      - name: Install
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Tests
        run: .venv/bin/pytest -q
      - name: Smoke
        run: .venv/bin/coworker --help

  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci-general]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -U "pip>=26.1"
          .venv/bin/pip install -e .
          .venv/bin/pip install --upgrade "pip-audit" "setuptools>=84.1.0" "wheel>=0.46.2" "certifi>=2026.10.18" "opentelemetry-api>=1.45.2"
      - run: .venv/bin/pip-audit
