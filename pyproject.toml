[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coworker-cli"
version = "0.9.1"
description = "Vendor-neutral CLI to delegate bulk I/O off your reasoning model."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Arcanada"}]
keywords = ["llm", "cli", "openai", "moonshot", "deepseek", "groq", "openrouter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pip-audit>=2.7",
  # tests/test_balance_error.py imports httpx directly. It used to arrive
  # transitively through openai, until openai 3.0.0 swapped httpx for httpx2 in
  # its core dependencies — at which point CI went red on a tree nobody had
  # touched. A module a test imports is a dependency that test declares.
  "httpx>=0.23",
]

[project.scripts]
coworker = "coworker.cli:main"

[project.urls]
Homepage = "https://github.com/Arcanada-one/coworker"
Issues = "https://github.com/Arcanada-one/coworker/issues"

[tool.setuptools.packages.find]
include = ["coworker*"]

[tool.setuptools.package-data]
# Vendored bash assets shipped inside the coworker.plugins package
# (e.g. rtk_signal_guard.sh — copied to ~/.local/bin on `coworker rtk enable`).
"coworker.plugins" = ["*.sh"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
